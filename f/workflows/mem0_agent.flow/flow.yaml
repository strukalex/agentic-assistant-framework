summary: Mem0 AI Memory Agent
description: >
  AI agent with memory capabilities using Mem0 for long-term personalization.
  Can store, search, and delete user memories semantically.
value:
  modules:
    - id: memory_agent
      summary: AI Memory Agent
      value:
        type: aiagent
        input_transforms:
          max_completion_tokens:
            type: static
            value: 1000
          history:
            type: static
            value:
              mode: auto
              context_length: 10
          output_type:
            type: static
            value: text
          provider:
            type: static
            value:
              kind: customai
              model: qwen2.5:latest
              resource: '$res:u/admin/ollama'
          streaming:
            type: static
            value: true
          system_prompt:
            type: static
            value: >
              You are a memory-powered assistant. You help users manage their
              personal knowledge base.


              You have access to these memory tools:


              1. **mem0_add** - Save important facts to memory
                 - Use when the user wants to remember something
                 - Extracts and stores relevant facts automatically
                 - Example: "Remember that I'm allergic to peanuts"

              2. **mem0_search** - Search and retrieve past memories
                 - Use when the user asks about something they told you before
                 - Returns semantically similar memories
                 - Example: "What do you know about my food preferences?"

              3. **mem0_delete** - Delete a specific memory
                 - Use when the user wants to forget something
                 - Requires the memory_id from search results
                 - Always confirm before deleting

              Guidelines:

              - When the user shares information, proactively offer to save it

              - When searching, summarize the relevant memories found

              - Before deleting, show the user what will be deleted and ask for
              confirmation

              - Be conversational and helpful

              - If no memories are found, let the user know and offer to help
              them remember something new
          temperature:
            type: static
            value: 0.0001
          user_message:
            type: javascript
            expr: flow_input.user_message
        tools:
          - id: mem0_add
            summary: add_memory
            description: "Save information to memory. REQUIRED parameter: content (string) - the information to remember. OPTIONAL parameter: metadata (object) - additional context."
            value:
              type: script
              path: f/tools/mem0_add
              tool_type: flowmodule
          - id: mem0_search
            summary: search_memory
            description: "Search for memories by semantic similarity. REQUIRED parameter: query (string) - the search query like 'food preferences' or 'work projects'. OPTIONAL parameter: top_k (integer, default 10) - max results to return."
            value:
              type: script
              path: f/tools/mem0_search
              tool_type: flowmodule
          - id: mem0_delete
            summary: delete_memory
            description: "Delete a specific memory by its ID. REQUIRED parameter: memory_id (string) - the ID of the memory to delete (obtained from search results)."
            value:
              type: script
              path: f/tools/mem0_delete
              tool_type: flowmodule
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    user_message:
      type: string
      description: User's message to the AI agent
  required:
    - user_message
