summary: 'AI chat agent that processes Telegram messages and responds'
description: 'Processes messages from Telegram users with an AI model (local Ollama or Azure) and sends responses back. Uses existing LLM infrastructure from paias.core.llm.'
language: python3
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    message:
      type: string
      description: User's message text
    chat_id:
      type: string
      description: Telegram chat ID to respond to
    message_id:
      type: integer
      description: Original message ID for reply threading
    user_id:
      type: integer
      description: Telegram user ID
    username:
      type: string
      description: Telegram username
      default: unknown
    first_name:
      type: string
      description: User's first name
      default: User
  required:
    - message
    - chat_id
