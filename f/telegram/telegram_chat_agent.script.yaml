summary: AI chat agent that processes Telegram messages and responds
description: >-
  Processes messages from Telegram users with an AI model (local Ollama or
  Azure) and sends responses back. Uses existing LLM infrastructure from
  paias.core.llm.
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    chat_id:
      type: string
      description: Telegram chat ID to respond to
    first_name:
      type: string
      description: User's first name
      default: User
    message:
      type: string
      description: User's message text
    message_id:
      type: integer
      description: Original message ID for reply threading
    user_id:
      type: integer
      description: Telegram user ID
    username:
      type: string
      description: Telegram username
      default: unknown
  required:
    - message
    - chat_id
