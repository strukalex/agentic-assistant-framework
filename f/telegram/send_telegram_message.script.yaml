summary: 'Send a message to a Telegram chat'
description: 'Windmill tool for sending messages to Telegram. Can be used by other workflows or as a standalone script. Supports Markdown and HTML formatting.'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    chat_id:
      type: string
      description: Telegram chat ID to send message to
    text:
      type: string
      description: Message text to send (supports Markdown or HTML)
    parse_mode:
      type: string
      description: 'Message parse mode: Markdown, HTML, or empty for plain text'
      default: Markdown
      enum:
        - Markdown
        - HTML
        - ''
    reply_to_message_id:
      type: integer
      description: Optional message ID to reply to
    disable_web_page_preview:
      type: boolean
      description: Whether to disable link previews
      default: false
  required:
    - chat_id
    - text
