summary: Telegram bot using long polling - for local development
description: >-
  Runs a long-polling bot that continuously checks for new messages from
  Telegram. Ideal for local development where you dont have an exposed webhook
  endpoint. Uses getUpdates API instead of webhooks.
lock: '!inline f/telegram/telegram_polling.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    max_runtime_seconds:
      type: integer
      description: Maximum runtime before stopping (leave empty to run forever)
      default: null
      minimum: 10
    polling_timeout:
      type: integer
      description: Long polling timeout in seconds (max 50)
      default: 10
      maximum: 50
      minimum: 1
  required: []
