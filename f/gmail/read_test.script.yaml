summary: Read Gmail Messages
description: >-
  Reads last 5 Gmail messages. If gmail_resource is not provided,
  falls back to GMAIL_RESOURCE env var.
lock: '!inline f/gmail/read_test.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    gmail_resource:
      type: string
      description: Windmill resource path for Gmail OAuth (optional, uses GMAIL_RESOURCE env var if not provided)
  required: []
