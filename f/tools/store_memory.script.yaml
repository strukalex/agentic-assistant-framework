summary: Store new research findings in long-term memory
description: >-
  Persist verified facts and synthesized answers to the vector database for
  future retrieval. Only store meaningful research findings.
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    content:
      type: string
      description: Research content to store (verified facts or synthesized answers)
      maxLength: 50000
      minLength: 10
    sources:
      type: array
      description: Optional list of source identifiers
      items:
        type: string
    topic:
      type: string
      description: Brief topic description for categorization
      maxLength: 200
      minLength: 1
  required:
    - content
    - topic
