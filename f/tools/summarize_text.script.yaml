summary: Summarize text using LLM
description: >-
  Summarizes text using the configured LLM (Azure AI Foundry or local Ollama).
  Supports different summary styles: concise, detailed, or bullet points.
lock: '!inline f/tools/summarize_text.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    max_length:
      type: integer
      description: Target maximum length for the summary in words
      default: 200
      maximum: 1000
      minimum: 10
    style:
      type: string
      description: Summary style
      default: concise
      enum:
        - concise
        - detailed
        - bullet_points
    text:
      type: string
      description: The text to summarize
      minLength: 1
  required:
    - text
