summary: 'Windmill-native research agent with tool orchestration'
description: |
  Research agent that orchestrates tools directly without MCP overhead.
  Uses LLM for intelligent tool selection and result synthesis.

  Features:
  - Memory search and storage (PostgreSQL + pgvector)
  - Web search (DuckDuckGo)
  - URL fetching with markdown conversion

  This is a simplified, Windmill-optimized version of the full ResearcherAgent.
lock: '!inline f/research/run_agent.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    topic:
      type: string
      description: Research topic (1-500 characters)
      minLength: 1
      maxLength: 500
    user_id:
      type: string
      description: Optional user identifier (UUID string)
    max_iterations:
      type: integer
      description: Maximum tool call iterations
      default: 5
      minimum: 1
      maximum: 20
    max_runtime_seconds:
      type: integer
      description: Maximum runtime in seconds
      default: 120
      minimum: 10
      maximum: 600
  required:
    - topic
