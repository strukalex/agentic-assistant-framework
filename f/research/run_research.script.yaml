summary: 'Research Agent (Native or LangGraph mode)'
description: |
  Execute deep research on a topic with two execution modes:

  - **native**: Fast, Windmill-native implementation without MCP overhead.
    Uses DuckDuckGo for web search (no API key required), direct LLM calls,
    and PostgreSQL memory storage.

  - **langgraph**: Full LangGraph workflow with MCP tools and approval gating.
    Implements plan-research-critique-refine cycle with quality thresholds.

lock: '!inline f/research/run_research.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    topic:
      type: string
      description: Research topic (1-500 characters)
      minLength: 1
      maxLength: 500
    mode:
      type: string
      description: "Execution mode: 'native' (fast, no MCP) or 'langgraph' (full workflow)"
      enum:
        - native
        - langgraph
      default: native
    user_id:
      type: string
      description: Optional user identifier (UUID string)
    client_traceparent:
      type: string
      description: Optional W3C traceparent for distributed tracing (langgraph mode only)
    max_researcher_runtime_seconds:
      type: integer
      minimum: 10
      description: Max runtime for researcher agent in seconds. Defaults to 60 (langgraph) or 120 (native).
    max_iterations:
      type: integer
      minimum: 1
      maximum: 20
      description: Max research iterations. Defaults to 5.
  required:
    - topic
