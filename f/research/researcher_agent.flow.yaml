# Windmill AI Agent Flow for Research
# This flow uses Windmill's native AI agent step with the standalone tools
#
# The flow:
# 1. Validates input and initializes context
# 2. Runs the AI agent with access to research tools
# 3. Formats and returns the final response

summary: 'AI-powered research agent with memory and web search'
description: |
  Research agent that can:
  - Search and store in semantic memory (PostgreSQL + pgvector)
  - Perform web searches (DuckDuckGo)
  - Fetch and parse web pages

  Uses Windmill's native AI agent step for intelligent tool orchestration.

value:
  modules:
    # Step 1: Initialize research context
    - id: init
      value:
        type: rawscript
        content: |
          # Initialize the research session
          import time
          from datetime import datetime, timezone

          def main(topic: str, user_id: str = None, traceparent: str = None):
              """Initialize research context."""
              from uuid import uuid4

              return {
                  "topic": topic,
                  "user_id": user_id or str(uuid4()),
                  "traceparent": traceparent,
                  "started_at": datetime.now(timezone.utc).isoformat(),
                  "session_id": str(uuid4()),
              }
        language: python3
        input_transforms:
          topic:
            type: javascript
            expr: flow_input.topic
          user_id:
            type: javascript
            expr: flow_input.user_id
          traceparent:
            type: javascript
            expr: flow_input.client_traceparent

    # Step 2: AI Agent - Core Research
    - id: researcher
      value:
        type: aiagent
        # AI Agent configuration
        ai_provider: azure_openai
        model: gpt-4
        temperature: 0.4
        max_tokens: 4096
        streaming: true

        # System prompt for the research agent
        system_prompt: |
          You are a ResearcherAgent for a Personal AI Assistant System.

          Current date: {{DATE}}

          Your capabilities:
          - search_memory: Query long-term memory for previously researched information
          - store_memory: Persist new verified facts to memory for future queries
          - web_search: Search the web for current information
          - fetch_url: Get full page content when search snippets aren't detailed enough

          ## Workflow

          1. Memory Check: Call search_memory() ONCE at the start.
             - If it returns relevant information: Use it to answer.
             - If NO RESULTS FOUND: Immediately call web_search().

          2. Web Search: When memory has no answer, search the web.

          3. Fetch Details (optional): If search snippets lack detail, use fetch_url().

          4. Store Findings: After synthesizing new research, call store_memory()
             with topic and sources metadata.

          5. Provide Answer: Return a structured response with your findings.

          ## HARD CONSTRAINTS

          1. SINGLE MEMORY ATTEMPT: Only ONE call to search_memory per query.
          2. NO LOOPING: Don't make the same tool call twice.
          3. SEQUENTIAL EXECUTION: One tool at a time, wait for results.
          4. STORE AFTER SEARCH: Don't call store_memory in the same turn as web_search.
          5. ONLY STORE FACTS: Never store queries, status messages, or "no results" responses.

        # Tools available to the agent
        tools:
          - path: f/tools/search_memory
            name: search_memory
            description: "Search semantic memory for relevant past knowledge. Returns list of documents with content and metadata."
          - path: f/tools/store_memory
            name: store_memory
            description: "Store new research findings in long-term memory. Requires content and topic parameters."
          - path: f/tools/web_search
            name: web_search
            description: "Search the web for information. Returns formatted results with titles, URLs, and snippets."
          - path: f/tools/fetch_url
            name: fetch_url
            description: "Fetch a URL and return its content as markdown. Use when search snippets need more detail."

        # Output schema for structured responses
        output_schema:
          type: object
          properties:
            answer:
              type: string
              description: "The final answer to the user's query"
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: "Self-assessed confidence score (0.0-1.0)"
            sources:
              type: array
              items:
                type: string
              description: "List of sources used (tool names or URLs)"
          required:
            - answer
            - confidence

        # Agent behavior settings
        messages_context_length: 15
        max_tool_iterations: 10

        input_transforms:
          prompt:
            type: javascript
            expr: |
              `Research the following topic and provide a comprehensive answer:

              Topic: ${results.init.topic}

              Remember to:
              1. First check memory for existing research
              2. Search the web if memory is empty
              3. Store any new findings for future use
              4. Provide a confident, well-sourced answer`

    # Step 3: Format Response
    - id: format_response
      value:
        type: rawscript
        content: |
          # Format the final response
          from datetime import datetime, timezone
          from typing import Any

          def main(
              init_context: dict,
              agent_response: dict,
          ) -> dict[str, Any]:
              """Format the research response."""

              # Extract agent output
              answer = agent_response.get("answer", "No answer generated")
              confidence = agent_response.get("confidence", 0.0)
              sources = agent_response.get("sources", [])

              # Build response
              return {
                  "status": "completed",
                  "topic": init_context.get("topic", ""),
                  "user_id": init_context.get("user_id", ""),
                  "session_id": init_context.get("session_id", ""),
                  "answer": answer,
                  "confidence": confidence,
                  "sources": sources,
                  "started_at": init_context.get("started_at", ""),
                  "completed_at": datetime.now(timezone.utc).isoformat(),
              }
        language: python3
        input_transforms:
          init_context:
            type: javascript
            expr: results.init
          agent_response:
            type: javascript
            expr: results.researcher

schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    topic:
      type: string
      description: Research topic (1-500 characters)
      minLength: 1
      maxLength: 500
    user_id:
      type: string
      description: Optional user identifier (UUID string)
    client_traceparent:
      type: string
      description: Optional W3C traceparent for distributed tracing
  required:
    - topic
